[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sdn-config-generator"
version = "0.1.0"
description = "SDN Multi-OS Config Generator"
authors = [
    { name="SDN Team" }
]
dependencies = [
    "click",
    "jinja2"
]

# ✅ ENTRY POINTS — all five ECU target plugins
[project.entry-points."sdn.plugins"]
android = "plugins.android.plugin:AndroidPlugin"
linux   = "plugins.linux.plugin:LinuxPlugin"
mcu     = "plugins.mcu.plugin:MCUPlugin"
qnx     = "plugins.qnx.plugin:QNXPlugin"
switch  = "plugins.switch.plugin:SwitchPlugin"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["core", "core.*", "plugins", "plugins.*", "sdk", "sdk.*"]