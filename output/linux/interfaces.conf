# Linux Interfaces

auto eth0
iface eth0 inet static
    address 192.168.1.10
    netmask 255.255.255.0

    vlan-raw-device eth0

auto eth1
iface eth1 inet static
    address 10.0.0.5
    netmask 255.255.255.0

    vlan-raw-device eth1


# Routes (inline for Linux)
up ip route add 0.0.0.0/0 via 192.168.1.1
